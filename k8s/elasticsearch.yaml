apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-deployment
  namespace: grade-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
          ports:
            - containerPort: 9200

          env:
            # Tek Elasticsearch node'u ile çalışacağımız için cluster discovery gerekmiyor.
            - name: discovery.type
              value: "single-node"

            # Elasticsearch kullanıcısının şifresi Kubernetes Secret'tan okunur.
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-secret
                  key: ELASTIC_PASSWORD

            # Minikube'un belleğini fazla tüketmemesi için Java heap sınırı.
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"

            # Elasticsearch HTTP API'sinde HTTPS'i aktif eder.
            - name: xpack.security.http.ssl.enabled
              value: "true"

            # Elasticsearch HTTPS için Kubernetes Secret'taki yeni sertifikayı kullanır.
            - name: xpack.security.http.ssl.keystore.path
              value: "/usr/share/elasticsearch/config/custom-certs/http.p12"

          volumeMounts:
            # Kubernetes Secret'taki http.p12 dosyasını Elasticsearch container'ına bağlar.
            - name: elasticsearch-http-cert
              mountPath: /usr/share/elasticsearch/config/custom-certs
              readOnly: true

      volumes:
        # Yeni HTTPS sertifikasını Kubernetes Secret'tan alır.
        - name: elasticsearch-http-cert
          secret:
            secretName: elasticsearch-http-cert

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: grade-system
spec:
  type: ClusterIP
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200