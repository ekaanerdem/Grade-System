spring.application.name=grade-system

# PostgreSQL bağlantısı
spring.datasource.url=jdbc:postgresql://localhost:5432/grade_system
spring.datasource.username=kaanerdem

# Hibernate mevcut tabloları korusun, gerektiğinde güncellesin
spring.jpa.hibernate.ddl-auto=update

# Spring Session tabloları gerektiğinde oluşturulsun
spring.session.jdbc.initialize-schema=always
