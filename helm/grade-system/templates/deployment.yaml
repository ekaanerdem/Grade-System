apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grade-system.fullname" . }}
  labels:
    {{- include "grade-system.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "grade-system.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "grade-system.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "grade-system.serviceAccountName" . }}

      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
        # CA sertifikasını ConfigMap'ten alır.
        - name: elasticsearch-ca
          configMap:
            name: elasticsearch-ca

      containers:
        - name: {{ .Chart.Name }}

          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # Veritabanı bağlantı adresi ConfigMap'ten okunur.
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: grade-system-config
                  key: DB_URL

            # Veritabanı kullanıcı adı Secret'tan okunur.
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grade-system-db-secret
                  key: DB_USERNAME

            # Veritabanı şifresi Secret'tan okunur.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grade-system-db-secret
                  key: DB_PASSWORD

            # JWT secret Kubernetes Secret'tan okunur.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grade-system-db-secret
                  key: JWT_SECRET
            
            # Valkey Kubernetes Service üzerinden erişilir.
            - name: VALKEY_HOST
              value: "valkey-service"

            # Valkey'in varsayılan portu.
            - name: VALKEY_PORT
              value: "6379"

            # Kubernetes içerisindeki Elasticsearch Service adresi.
            - name: ELASTICSEARCH_URL
              value: "https://elasticsearch-service:9200"

            # Elasticsearch kullanıcı adı.
            - name: ELASTICSEARCH_USERNAME
              value: "elastic"

            # Elasticsearch şifresi Kubernetes Secret'tan okunur.
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-secret
                  key: ELASTIC_PASSWORD

            # Elasticsearch CA sertifikasının container içindeki yolu.
            - name: SPRING_SSL_BUNDLE_PEM_ELASTICSEARCH_TRUSTSTORE_CERTIFICATE
              value: "file:/app/certs/http_ca.crt"

            # Elasticsearch bağlantısında yukarıdaki SSL bundle kullanılır.
            - name: SPRING_ELASTICSEARCH_RESTCLIENT_SSL_BUNDLE
              value: "elasticsearch"

            # Spring Boot, Kubernetes içerisindeki Kafka Service'e bağlanır.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"

          volumeMounts:
            # Elasticsearch CA sertifikasını container içine bağlar.
            - name: elasticsearch-ca
              mountPath: /app/certs
              readOnly: true

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP

          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          # Helm chart'ın varsayılan volumeMounts alanı.
          # Elasticsearch volumeMounts yukarıda tanımlandığı için şu an kullanılmıyor.
          # {{- with .Values.volumeMounts }}
          # volumeMounts:
          #   {{- toYaml . | nindent 12 }}
          # {{- end }}

      # Helm chart'ın varsayılan volumes alanı.
      # Elasticsearch volume yukarıda tanımlandığı için şu an kullanılmıyor.
      # {{- with .Values.volumes }}
      # volumes:
      #   {{- toYaml . | nindent 8 }}
      # {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}