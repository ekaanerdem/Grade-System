apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgresql.storage }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          ports:
            - containerPort: {{ .Values.postgresql.servicePort }}

          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}

            # PostgreSQL kullanıcı adı Kubernetes Secret'tan okunacak.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: grade-system-db-secret
                  key: DB_USERNAME

            # PostgreSQL şifresi Kubernetes Secret'tan okunacak.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grade-system-db-secret
                  key: DB_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: {{ .Values.postgresql.servicePort }}
      targetPort: {{ .Values.postgresql.servicePort }}